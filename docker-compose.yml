services:
  frontend:
    build:
      context: .
      target: runner
      args:
        # Baked into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://147.93.180.179:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Browser-side base (fallback when not using relative /api routes).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://147.93.180.179:8000}
      # Server-side base used by Next API routes / SSR.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://147.93.180.179:8000}
