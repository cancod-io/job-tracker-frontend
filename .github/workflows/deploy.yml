name: CI Build & Notify VPS

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  build-and-validate:
    name: Build and Validate Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

  notify-vps:
    name: Notify VPS Deployment
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Send webhook to VPS
        run: |
          curl -X POST https://webhook.site/cbeb2d77-b739-4d4b-ae87-f363e9c1148d \
            -H "Content-Type: application/json" -d '{}'
          curl -X POST http://147.93.180.179:8080/deploy \
            -H "Content-Type: application/json" -d '{}'